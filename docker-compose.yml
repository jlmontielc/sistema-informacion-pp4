services:
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

  backend-flask:
    build: ./backend-flask
    expose:
      - "5000"
    env_file: ./backend-flask/.env
    restart: unless-stopped

  backend-node:
    build: ./backend-node
    ports:
      - "3000:3000"
    env_file: ./backend-node/.env
    environment:
      - NODE_ENV=production
      - FLASK_IA_URL=http://backend-flask:5000
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=/api
    ports:
      - "80:80"
    depends_on:
      - backend-node
      - backend-flask
    restart: unless-stopped
